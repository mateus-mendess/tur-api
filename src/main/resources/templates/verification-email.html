<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Confirme seu cadastro</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
                <tr>
                    <td style="background-color:#ffffff; padding:24px 32px; border-bottom:1px solid #e5e7eb;">
                        <span style="color:#111827; font-size:20px; font-weight:bold;">tur<span style="color:#b85c37;">.</span></span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <h1 style="margin:0 0 16px 0; font-size:20px; color:#111827;">Confirme seu cadastro</h1>
                        <p style="margin:0 0 24px 0; font-size:15px; color:#4b5563; line-height:1.5;">
                            Olá! Use o código abaixo para confirmar seu cadastro na plataforma <strong>tur.</strong>
                        </p>
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td align="center" style="padding:16px 0;">
                                    <span th:text="${code}"
                                          style="display:inline-block; font-size:32px; font-weight:bold; letter-spacing:8px; color:#000000; background-color:#ffffff; padding:12px 24px; border-radius:6px; border:1px solid #e5e7eb;">
                                        123456
                                    </span>
                                </td>
                            </tr>
                        </table>
                        <p style="margin:24px 0 0 0; font-size:13px; color:#6b7280; line-height:1.5;">
                            Esse código expira em 10 minutos. Se você não solicitou esse cadastro, pode ignorar este e-mail.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 32px; background-color:#f9fafb; border-top:1px solid #e5e7eb;">
                        <p style="margin:0; font-size:12px; color:#9ca3af;">
                            tur. — guia digital de turismo
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
