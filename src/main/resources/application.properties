spring.application.name=tur

#CONFIG DATABASE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

jwt.cookie.name=JWT-TOKEN

#GEOCODING
geocoding.url=https://nominatim.openstreetmap.org/search
geocoding.user-agent=tur-api/1.0 (https://github.com/mateus-mendess)

#SUPABASE STORAGE CONFIG
supabase.url=${SUPABASE_URL}
supabase.url-public=${SUPABASE_URL_PUBLIC}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.bucket=${SUPABASE_BUCKET_NAME}

#MAX FILE
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB

#PAGEABLE CONFIG
spring.data.web.pageable.max-page-size=50