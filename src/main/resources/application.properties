spring.application.name=tur

spring.profiles.active=dev

#CONFIG DATABASE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

#KEYS JWT
jwt.public.key=classpath:keys/public.pem
jwt.private.key=classpath:keys/private.pem

#SUPABASE STORAGE CONFIG
supabase.url=${SUPABASE_URL}
supabase.url-public=${SUPABASE_URL_PUBLIC}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.bucket=${SUPABASE_BUCKET_NAME}

#MAX FILE
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB

#CREDENTIALS EMAIL
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#CACHE
spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=10m