#DOMAIN FRONT
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

#CREDENTIALS DATABASE
spring.datasource.url=${DB_URL_SB}
spring.datasource.username=${DB_USER_SB}
spring.datasource.password=${DB_PASSWORD_SB}

#KEYS JWT
jwt.public.key=file:${JWT_PUBLIC_KEY_PATH}
jwt.private.key=file:${JWT_PRIVATE_KEY_PATH}

#CREDENTIALS EMAIL
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
app.mail-from=${MAIL_FROM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#SWAGGER CONFIG
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false